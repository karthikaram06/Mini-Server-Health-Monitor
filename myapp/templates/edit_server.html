<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Server</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141e30,#243b55);
}

.card{
    width:420px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    color:white;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.02);
}

h2{
    text-align:center;
    margin-bottom:20px;
    letter-spacing:1px;
}

input, select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:14px;
}

input:focus, select:focus{
    box-shadow:0 0 8px #00c6ff;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:linear-gradient(90deg,#0072ff,#00c6ff);
    transform:translateY(-2px);
}

.label{
    font-size:12px;
    margin-top:5px;
    opacity:0.8;
}
</style>

</head>
<body>

<div class="card">
    <h2>✏️ Edit Server</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="label">Server Name</div>
        <input type="text" name="server_name" value="{{ server.server_name }}" required>

        <div class="label">IP Address</div>
        <input type="text" name="ip_address" value="{{ server.ip_address }}" required>

        <div class="label">Operating System</div>
        <input type="text" name="operating_system" value="{{ server.operating_system }}" required>

        <div class="label">CPU Usage (%)</div>
        <input type="number" name="cpu_usage" value="{{ server.cpu_usage }}" required>

        <div class="label">RAM Usage (%)</div>
        <input type="number" name="ram_usage" value="{{ server.ram_usage }}" required>

        <div class="label">Disk Usage (%)</div>
        <input type="number" name="disk_usage" value="{{ server.disk_usage }}" required>

        <div class="label">Status</div>
        <select name="status">
            <option value="Online" {% if server.status == "Online" %}selected{% endif %}>🟢 Online</option>
            <option value="Offline" {% if server.status == "Offline" %}selected{% endif %}>🔴 Offline</option>
        </select>

        <button type="submit">Update Server</button>
    </form>
</div>

</body>
</html>
